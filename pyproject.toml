[project]
name = "ppr"
version = "0.1.0"
description = "Crawl accepted papers and citation data from top AI/ML, CV, robotics, NLP, security and SE conferences"
authors = [{ name = "Minseok Choi", email = "minseok.choi@kaist.ac.kr" }]
readme = "README.md"
requires-python = ">=3.13"
# What `uv tool install git+https://github.com/brightjade/paper-explorer` installs:
# the search side only. The pipeline runs from a checkout, where `uv sync` adds
# the `pipeline` group by default (tool.uv.default-groups).
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.28",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]
pipeline = [
    "openreview-py>=1.40",
    "beautifulsoup4>=4.14.3",
    "requests>=2.33.0",
    "tqdm>=4.67",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[project.scripts]
ppr = "ppr.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["ppr"]

[tool.hatch.build.targets.wheel.force-include]
"configs/venues.yaml" = "ppr/_venues.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
