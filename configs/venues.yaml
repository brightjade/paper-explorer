# Registry of tracked conference venues, used by `ppr discover` and `ppr autoregister`.
#
# source:   openreview | dblp | researchr | crossref | roboticsproceedings | cvf | usenix | acl | aaai | bespoke
#           acl/aaai/bespoke need a hand-written scraper per year, so discovery
#           reports them as needs-manual rather than auto-registering them.
# cadence:  annual | biennial-odd | biennial-even
# probe:    source-specific template; {year} is the 4-digit year, {yy} the last two.
venues:
  # --- OpenReview (requires credentials) ---
  iclr:
    name: ICLR
    source: openreview
    cadence: annual
    announce_month: 1
    probe: {venue_id: "ICLR.cc/{year}/Conference"}
  neurips:
    name: NeurIPS
    source: openreview
    cadence: annual
    announce_month: 9
    probe: {venue_id: "NeurIPS.cc/{year}/Conference"}
    extra_tracks:
      - {venue_id: "NeurIPS.cc/{year}/Datasets_and_Benchmarks_Track", prefix: datasets}
  icml:
    name: ICML
    source: openreview
    cadence: annual
    announce_month: 5
    probe: {venue_id: "ICML.cc/{year}/Conference"}
  colm:
    name: COLM
    source: openreview
    cadence: annual
    announce_month: 7
    probe: {venue_id: "colmweb.org/COLM/{year}/Conference"}
  corl:
    name: CoRL
    source: openreview
    cadence: annual
    announce_month: 9
    probe: {venue_id: "robot-learning.org/CoRL/{year}/Conference"}

  # --- researchr (SE research tracks) ---
  # Track slugs drift between years, so the probe tries these in order and
  # records the one that matched. announce_month is when the accepted list
  # usually goes up on researchr, not when DBLP indexes the proceedings.
  icse:
    name: ICSE
    source: researchr
    cadence: annual
    announce_month: 1
    probe: {conf: icse, track_slugs: &se_track_slugs [research-track, research-papers, technical-track, technical-papers, papers, research]}
  fse:
    name: FSE
    source: researchr
    cadence: annual
    announce_month: 4
    probe: {conf: fse, track_slugs: *se_track_slugs}
  ase:
    name: ASE
    source: researchr
    cadence: annual
    announce_month: 8
    probe: {conf: ase, track_slugs: *se_track_slugs}
  issta:
    name: ISSTA
    source: researchr
    cadence: annual
    announce_month: 5
    probe: {conf: issta, track_slugs: *se_track_slugs}

  # --- Crossref (IEEE robotics proceedings) ---
  # 2023-2025 stay in DBLP_CONFERENCES. New years come from Crossref, which
  # has IEEE's deposit months before DBLP indexes it. The probe is an exact
  # count, so announce_month never drives a stale-empty warning here.
  icra:
    name: ICRA
    source: crossref
    cadence: annual
    announce_month: 7
    probe: {prefix: "10.1109", container: "{year} IEEE International Conference on Robotics and Automation (ICRA)"}
  iros:
    name: IROS
    source: crossref
    cadence: annual
    announce_month: 12
    probe: {prefix: "10.1109", container: "{year} IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)"}

  # --- roboticsproceedings.org (RSS) ---
  rss:
    name: RSS
    source: roboticsproceedings
    cadence: annual
    announce_month: 7
    probe: {volume_offset: 2004}

  # --- DBLP ---
  ijcai:
    name: IJCAI
    source: dblp
    cadence: annual
    announce_month: 4
    probe: {toc: "db/conf/ijcai/ijcai{year}.bht"}

  # --- CVF / ECVA ---
  cvpr:
    name: CVPR
    source: cvf
    cadence: annual
    announce_month: 2
    probe: {url: "https://openaccess.thecvf.com/CVPR{year}?day=all"}
  iccv:
    name: ICCV
    source: cvf
    cadence: biennial-odd
    announce_month: 7
    probe: {url: "https://openaccess.thecvf.com/ICCV{year}?day=all"}
  wacv:
    name: WACV
    source: cvf
    cadence: annual
    announce_month: 10
    probe: {url: "https://openaccess.thecvf.com/WACV{year}"}
  eccv:
    name: ECCV
    source: cvf
    cadence: biennial-even
    announce_month: 7
    probe: {url: "https://www.ecva.net/papers.php", marker: "ECCV {year}"}

  # --- USENIX ---
  usenix_security:
    name: USENIX Security
    source: usenix
    cadence: annual
    announce_month: 6
    probe: {slug: "usenixsecurity{yy}"}

  # --- Hand-written scrapers (report only) ---
  acl:
    name: ACL
    source: acl
    cadence: annual
    announce_month: 5
    probe: {url: "https://{year}.aclweb.org/"}
  emnlp:
    name: EMNLP
    source: acl
    cadence: annual
    announce_month: 9
    probe: {url: "https://{year}.emnlp.org/"}
  naacl:
    name: NAACL
    source: acl
    cadence: annual
    announce_month: 3
    probe: {url: "https://{year}.naacl.org/"}
  eacl:
    name: EACL
    source: acl
    cadence: annual
    announce_month: 1
    probe: {url: "https://{year}.eacl.org/"}
  coling:
    name: COLING
    source: acl
    cadence: annual
    announce_month: 11
    probe: {url: "https://coling{year}.org/"}
  aaai:
    name: AAAI
    source: aaai
    cadence: annual
    announce_month: 12
    probe: {url: "https://ojs.aaai.org/index.php/AAAI/issue/archive"}
